name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish desktop shell
        shell: pwsh
        run: dotnet publish desktop/Jelon.Desktop/Jelon.Desktop.csproj -c Release -p:PublishProfile=win-x64

      - name: Package Python core
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/python/build_core.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging/installer/Jelon.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Jelon-Windows-x64
          path: dist/installer/Jelon-Setup.exe
          if-no-files-found: error
